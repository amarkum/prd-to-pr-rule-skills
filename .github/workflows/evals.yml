# Behavioural tests for the skills and hooks (real model runs). Manual, because they cost money.
name: plugin-evals
on:
  workflow_dispatch:
    inputs:
      runs: {description: "runs per case", default: "3"}
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Sandbox for granted shell tools
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0   # Ubuntu 24.04 runners restrict user namespaces
      - name: Run sdlc-core evals
        working-directory: plugins/sdlc-core
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
        run: >-
          claude plugin eval . --trust-plugin --scaffold --allow-tools Bash Edit Write
          --runs "$RUNS" --threshold 0.8 --no-publish --max-cost-usd 15 --json "$GITHUB_WORKSPACE/eval-results.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval-results.json
