name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]     # oldest and newest supported for the scripts and hooks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -v
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7   # not the runner's system Python, which refuses pip installs (PEP 668)
        with:
          python-version: "3.12"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and every plugin (strict; versions are omitted on purpose)
        run: python3 tools/validate_plugins.py
      - name: Always-on token budget per plugin
        run: for p in plugins/*/; do claude --plugin-dir "$p" plugin details "$(basename "$p")"; done
      - name: Lint the shared workflow and the caller template (actionlint)
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # job.workflow_repository and job.workflow_sha are newer than actionlint's context list (docs: contexts reference)
          ./actionlint -ignore 'property "workflow_(repository|sha)" is not defined' .github/workflows/*.yml
          mkdir -p "$RUNNER_TEMP/caller/.github/workflows"
          sed 's#{{standard}}#octo-org/ai-sdlc#' templates/repo/common/.github/workflows/ai-sdlc.yml > "$RUNNER_TEMP/caller/.github/workflows/ai-sdlc.yml"
          (cd "$RUNNER_TEMP/caller" && "$GITHUB_WORKSPACE/actionlint" .github/workflows/ai-sdlc.yml)
      - name: Templates parse
        run: |
          pip install pyyaml
          python3 -c "import glob, json, yaml; [yaml.safe_load(open(f)) for f in glob.glob('templates/**/*.yml', recursive=True)]; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True) if '/results/' not in f]"
