# Multi-agent PR review with anthropics/claude-code-action.
# Copy to .github/workflows/ in the pilot repository. Needs the Claude GitHub App
# (run /install-github-app in Claude Code) and an ANTHROPIC_API_KEY repository secret.
#
# Job 1 runs the code-review plugin, as in the Claude Code docs.
# Job 2 runs this repository's own specialist subagents from .claude/agents and posts one
# synthesised review that separates "agents absorb" from "humans judge".
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

  specialist-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}

            Review this pull request with the repository's specialist subagents. Do not change files.
            1. Read the PR description and find the change folder it links (docs/changes/<id>/).
               Note its class and whether the artifacts that class requires are present.
            2. Get the diff with `git diff origin/${{ github.base_ref }}...HEAD`.
            3. In parallel, run the architecture-reviewer and security-reviewer subagents, and ask the
               test-engineer subagent for a read-only critique of test coverage. Give each the diff,
               the changed files and the change folder.
            4. Pass all findings to the review-synthesizer subagent. Do not write review.md in CI;
               ask it to return the review as markdown instead.
            5. Post one PR comment with the synthesised review: blocking findings first, then
               "Agents absorb" and "Humans judge". Each finding keeps severity, confidence, evidence,
               file:line, policy and remediation. Post inline comments for blocking findings only.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Agent,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
