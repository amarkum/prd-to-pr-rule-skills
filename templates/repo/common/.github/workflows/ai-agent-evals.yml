# Stage 4, Test: continuous evals. CLAUDE.md, REVIEW.md, .claude/ and the plugins steer the agent, so changes to them
# get regression-tested like code: on every PR that touches them and nightly (which also catches model changes).
# A pass rate below the threshold fails the check. Each run calls Claude once per eval and costs money.
# Runs only when the repository variable AISDLC_AUTOMATION is "on".
name: ai-agent-evals
on:
  pull_request:
    paths: ["CLAUDE.md", "REVIEW.md", ".claude/**", "evals/**", ".ai/repo.yaml"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
env:
  AISDLC_REPO: amarkum/prd-to-pr-rule-skills
  AISDLC_REF: main            # pin to a release tag of the standard
jobs:
  evals:
    if: vars.AISDLC_AUTOMATION == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - id: present
        run: |
          if ls evals/*.json >/dev/null 2>&1; then echo "any=true" >> "$GITHUB_OUTPUT"
          else echo "No evals yet; see evals/README.md"; fi
      - uses: actions/checkout@v7
        if: steps.present.outputs.any == 'true'
        with: {repository: "${{ env.AISDLC_REPO }}", ref: "${{ env.AISDLC_REF }}", path: .ai-sdlc}
      # Toolchain for the repo's checks: copy the setup and install steps from this repo's ai-evidence.yml.
      - uses: actions/setup-node@v7
        if: steps.present.outputs.any == 'true'
        with: {node-version: 22}
      - name: Claude Code with the standard's plugins
        if: steps.present.outputs.any == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add "$AISDLC_REPO"
          for p in $(python3 -c "import json;print(' '.join(k for k,v in json.load(open('.claude/settings.json')).get('enabledPlugins',{}).items() if v))"); do
            claude plugin install "$p"
          done
      - name: Run the evals
        if: steps.present.outputs.any == 'true'
        run: python3 .ai-sdlc/plugins/sdlc-core/scripts/agent_evals.py run --threshold 0.8 --json agent-evals.json --md agent-evals.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Report
        if: always() && steps.present.outputs.any == 'true'
        run: cat agent-evals.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always() && steps.present.outputs.any == 'true'
        with: {name: agent-evals, path: "agent-evals.*", retention-days: 90}
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        if: always() && steps.present.outputs.any == 'true' && github.event_name == 'pull_request'
        with: {header: ai-agent-evals, path: agent-evals.md}
