# Compounding step: after a merge, propose reviewed knowledge and rule updates (never merged automatically).
name: ai-learn
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  learn:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'ai-assisted')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/amarkum/prd-to-pr-rule-skills.git
          plugins: |
            sdlc-core@ai-sdlc
          prompt: |
            /sdlc-core:learn ${{ github.event.pull_request.number }}
            Repo-scoped lessons: open a PR in this repo (docs/knowledge/, CLAUDE.md). Org- or stack-wide lessons: write them to
            .ai/knowledge-proposals.md and list them in that PR, so a maintainer can forward them to the standard repo.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Write,Edit,Skill,Bash(gh pr view *),Bash(gh api *),Bash(gh run list *),Bash(git *),Bash(gh pr create *)"
